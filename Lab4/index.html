<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Weather</h1>
    <p class="intro">Enter a location to see the current conditions.</p>

    <div class="search">
      <label for="city">City
        <input type="text" id="city" placeholder="Montreal" autocomplete="off">
      </label>
      <label for="region">Province/State
        <input type="text" id="region" placeholder="Quebec" autocomplete="off">
      </label>
      <label for="country">Country
        <input type="text" id="country" placeholder="Canada" autocomplete="off">
      </label>
      <button id="get-weather" type="button">Get Weather</button>
    </div>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="weather" class="weather" aria-live="polite" hidden>
      <h2 id="location"></h2>
      <dl>
        <div><dt>Temperature</dt><dd id="temperature"></dd></div>
        <div><dt>Feels like</dt><dd id="apparent"></dd></div>
        <div><dt>Wind speed</dt><dd id="wind"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
      </dl>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
